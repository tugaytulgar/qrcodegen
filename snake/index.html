<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0e1418"><title>Nokia 5510 Snake</title><style>:root{--lcd:#9eaa6c;--ink:#26301f}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#0e1418;font-family:Arial,sans-serif}body{min-height:100dvh;overflow:hidden}.page{min-height:100dvh;display:grid;place-items:center;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}.phone{width:min(96vw,410px);height:min(96dvh,790px);padding:24px 22px 18px;border-radius:38px 38px 72px 72px;background:linear-gradient(160deg,#29424f,#172934 72%);border:5px solid #091116;box-shadow:0 20px 50px #000a;display:flex;flex-direction:column;align-items:center}.ear{width:95px;height:12px;border-radius:99px;background:repeating-linear-gradient(90deg,#0b1115 0 4px,#40535e 4px 7px)}.brand{color:#eef3f0;font-size:21px;font-weight:900;letter-spacing:2px;margin:7px 0 10px}.screen{width:100%;padding:12px;border-radius:28px 28px 18px 18px;background:linear-gradient(#d7dedb,#78847f);border:4px solid #0b1419}.top,.score{display:flex;justify-content:space-between;color:#111;font:900 12px 'Courier New',monospace;padding:0 4px 5px}.score{padding:6px 4px 0}.lcd{position:relative;aspect-ratio:4/3;background:var(--lcd);border:4px solid #28312a;border-radius:7px;overflow:hidden}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#9eaa6cb8;color:var(--ink);font:900 14px 'Courier New',monospace;padding:16px}.overlay b{font-size:32px}.hidden{display:none}.soft{display:flex;gap:78px;margin-top:14px}.pill,.key{border:2px solid #0b151a;color:white;background:linear-gradient(#436170,#223a46);box-shadow:0 3px 0 #081014;font-weight:900}.pill{width:64px;height:32px;border-radius:99px}.controls{position:relative;width:190px;height:144px;margin:5px 0}.key{position:absolute;width:62px;height:48px;border-radius:18px;font-size:20px;touch-action:manipulation}.up{left:64px;top:0}.left{left:0;top:49px}.center{left:64px;top:49px;border-radius:50%}.right{right:0;top:49px}.down{left:64px;bottom:0}.pad{width:92%;display:grid;grid-template-columns:repeat(3,1fr);gap:7px 10px}.pad span{height:38px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(#334f5d,#1f3540);border:2px solid #0d1a20;color:#e8eeeb;font-weight:800}.chin{margin-top:auto;color:#9dadb3;font-size:11px;letter-spacing:3px}@media(max-height:720px){.phone{transform:scale(.88);transform-origin:center}}</style></head><body><main class="page"><section class="phone"><div class="ear"></div><div class="brand">NOKIA</div><div class="screen"><div class="top"><span>SNAKE</span><span id="status">HAZIR</span></div><div class="lcd"><canvas id="game" width="288" height="216"></canvas><div id="overlay" class="overlay"><div><b>SNAKE II</b><br><br>Başlamak için ▶</div></div></div><div class="score"><span>SKOR <b id="score">0</b></span><span>REKOR <b id="high">0</b></span></div></div><div class="soft"><button id="start" class="pill">▶</button><button id="pause" class="pill">Ⅱ</button></div><div class="controls"><button class="key up" data-dir="up">▲</button><button class="key left" data-dir="left">◀</button><button id="center" class="key center">●</button><button class="key right" data-dir="right">▶</button><button class="key down" data-dir="down">▼</button></div><div class="pad"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>*</span><span>0</span><span>#</span></div><div class="chin">5510</div></section></main><script>(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),highEl=document.getElementById('high'),statusEl=document.getElementById('status'),overlay=document.getElementById('overlay');const COLS=24,ROWS=18,CELL=12;let snake,food,dir,nextDir,timer,running=false,paused=false,score=0,speed=145,high=+localStorage.getItem('snake5510HighScore')||0;highEl.textContent=high;function reset(){snake=[{x:8,y:9},{x:7,y:9},{x:6,y:9},{x:5,y:9}];dir={x:1,y:0};nextDir={x:1,y:0};score=0;speed=145;scoreEl.textContent=0;placeFood();draw()}function placeFood(){do{food={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}function start(){if(!running){reset();running=true;paused=false;overlay.classList.add('hidden');statusEl.textContent='OYUN';sched()}else if(paused)togglePause()}function sched(){clearInterval(timer);timer=setInterval(tick,speed)}function togglePause(){if(!running)return start();paused=!paused;statusEl.textContent=paused?'DURDU':'OYUN';overlay.innerHTML=paused?'<div><b>DURDU</b><br><br>Devam için ●</div>':'';overlay.classList.toggle('hidden',!paused)}function end(){running=false;clearInterval(timer);if(score>high){high=score;localStorage.setItem('snake5510HighScore',high);highEl.textContent=high}statusEl.textContent='BİTTİ';overlay.innerHTML='<div><b>OYUN BİTTİ</b><br><br>Skor: '+score+'<br>Tekrar için ▶</div>';overlay.classList.remove('hidden')}function tick(){if(!running||paused)return;dir=nextDir;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=COLS||h.y<0||h.y>=ROWS||snake.some(p=>p.x===h.x&&p.y===h.y))return end();snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;scoreEl.textContent=score;placeFood();const ns=Math.max(68,145-Math.floor(score/50)*5);if(ns!==speed){speed=ns;sched()}}else snake.pop();draw()}function draw(){x.fillStyle='#9eaa6c';x.fillRect(0,0,c.width,c.height);x.strokeStyle='rgba(45,55,32,.08)';for(let i=0;i<=COLS;i++){x.beginPath();x.moveTo(i*CELL,0);x.lineTo(i*CELL,c.height);x.stroke()}for(let i=0;i<=ROWS;i++){x.beginPath();x.moveTo(0,i*CELL);x.lineTo(c.width,i*CELL);x.stroke()}x.fillStyle='#26301f';const fx=food.x*CELL+CELL/2,fy=food.y*CELL+CELL/2;x.beginPath();x.moveTo(fx,fy-4);x.lineTo(fx+4,fy);x.lineTo(fx,fy+4);x.lineTo(fx-4,fy);x.closePath();x.fill();snake.forEach((p,i)=>{const pad=i?2:1;x.fillRect(p.x*CELL+pad,p.y*CELL+pad,CELL-pad*2,CELL-pad*2)})}function setDir(n){const m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}},nd=m[n];if(!nd)return;if(nd.x===-dir.x&&nd.y===-dir.y)return;nextDir=nd;if(!running)start()}document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();setDir(b.dataset.dir)}));document.getElementById('start').onclick=()=>{if(running){running=false;clearInterval(timer)}start()};document.getElementById('pause').onclick=togglePause;document.getElementById('center').onclick=()=>running?togglePause():start();let ts=null;c.addEventListener('pointerdown',e=>ts={x:e.clientX,y:e.clientY});c.addEventListener('pointerup',e=>{if(!ts)return;const dx=e.clientX-ts.x,dy=e.clientY-ts.y;ts=null;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;setDir(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')});window.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),m={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};if(m[k]){e.preventDefault();setDir(m[k])}else if(k===' ')togglePause()},{passive:false});reset()})();</script></body></html>
